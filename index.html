<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼스널컬러 · 12型精细色彩诊断</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0c0b;
  --surface: #161412;
  --surface2: #1e1b18;
  --border: #2e2a26;
  --text: #f0ebe4;
  --text2: #9a9086;
  --accent: #c8a97e;
  --accent2: #8a6a45;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 80px;
}

/* ── INTRO ── */
.intro {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  position: relative;
  overflow: hidden;
}

.intro-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%, rgba(200,169,126,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 80% 70%, rgba(100,140,180,0.06) 0%, transparent 70%);
}

.season-strip {
  display: flex;
  gap: 3px;
  margin-bottom: 40px;
  position: relative;
}

.season-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}

.intro h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 8vw, 64px);
  font-weight: 300;
  letter-spacing: 2px;
  text-align: center;
  line-height: 1.15;
  position: relative;
}

.intro h1 em {
  font-style: italic;
  color: var(--accent);
}

.intro-sub {
  margin-top: 20px;
  color: var(--text2);
  font-size: 12px;
  letter-spacing: 3px;
  text-align: center;
  line-height: 2;
  position: relative;
}

.intro-tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 32px 0;
  max-width: 420px;
  position: relative;
}

.intro-tag {
  padding: 4px 14px;
  border: 1px solid var(--border);
  font-size: 11px;
  color: var(--text2);
  letter-spacing: 1px;
  border-radius: 40px;
}

.start-btn {
  position: relative;
  margin-top: 8px;
  background: none;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  letter-spacing: 3px;
  padding: 14px 48px;
  cursor: pointer;
  transition: all 0.3s;
}

.start-btn:hover {
  background: var(--accent);
  color: var(--bg);
}

/* ── QUIZ ── */
.quiz-wrap {
  width: 100%;
  max-width: 540px;
  padding: 0 20px;
  display: none;
}

.top-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 32px 0 28px;
}

.progress-track {
  flex: 1;
  height: 1px;
  background: var(--border);
  position: relative;
}

.progress-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--accent);
  transition: width 0.5s ease;
}

.q-counter {
  font-size: 11px;
  color: var(--text2);
  letter-spacing: 2px;
  white-space: nowrap;
}

.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 32px 28px 28px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.4s ease forwards;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.q-tag {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--accent2);
  margin-bottom: 14px;
  text-transform: uppercase;
}

.q-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  line-height: 1.6;
  margin-bottom: 24px;
  color: var(--text);
}

.q-hint {
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 20px;
  line-height: 1.7;
}

/* text options */
.opts-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 16px;
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  color: var(--text);
  text-align: left;
  line-height: 1.6;
  transition: all 0.2s;
}

.opt:hover {
  border-color: var(--accent);
  background: rgba(200,169,126,0.05);
  transform: translateX(5px);
}

.opt-n {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text2);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.2s;
}

.opt:hover .opt-n {
  border-color: var(--accent);
  color: var(--accent);
}

/* swatch options */
.opts-swatch {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
}

.sw-btn {
  border: 2px solid transparent;
  padding: 0;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.25s;
  font-family: 'Noto Sans SC', sans-serif;
}

.sw-btn:hover {
  border-color: rgba(255,255,255,0.6);
  transform: scale(1.04);
}

.sw-color {
  height: 64px;
}

.sw-label {
  background: var(--surface2);
  border-top: 1px solid var(--border);
  padding: 7px 8px;
  font-size: 11px;
  color: var(--text2);
  text-align: center;
  line-height: 1.4;
}

/* compare pair */
.opts-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.pair-btn {
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.2s;
  font-family: 'Noto Sans SC', sans-serif;
}

.pair-btn:hover {
  border-color: var(--accent);
  transform: scale(1.03);
}

.pair-color {
  height: 80px;
}

.pair-label {
  padding: 10px;
  font-size: 12px;
  color: var(--text2);
  text-align: center;
  line-height: 1.5;
}

/* ── RESULT ── */
.result-wrap {
  width: 100%;
  max-width: 540px;
  padding: 0 20px 40px;
  display: none;
}

.result-header {
  margin-top: 40px;
  padding: 40px 28px 36px;
  position: relative;
  overflow: hidden;
}

.rh-bg {
  position: absolute;
  inset: 0;
  opacity: 0.9;
}

.rh-content {
  position: relative;
}

.r-season-label {
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 8px;
}

.r-type-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px;
  font-weight: 600;
  line-height: 1.1;
  margin-bottom: 4px;
}

.r-type-en {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-style: italic;
  opacity: 0.65;
  margin-bottom: 20px;
}

.r-palette {
  display: flex;
  gap: 5px;
  margin-bottom: 16px;
}

.r-pal-swatch {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
}

.r-score-bar {
  display: flex;
  gap: 12px;
  font-size: 11px;
  opacity: 0.65;
}

.result-body {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  padding: 28px;
}

.r-desc {
  font-size: 13.5px;
  line-height: 1.9;
  color: var(--text2);
  margin-bottom: 28px;
}

.r-section {
  margin-bottom: 22px;
}

.r-sec-title {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--accent2);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.r-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.r-tag {
  padding: 4px 12px;
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text2);
  border-radius: 40px;
}

.r-tag.good {
  border-color: var(--accent2);
  color: var(--accent);
}

.r-tag.bad {
  border-color: #4a3030;
  color: #9a7070;
}

.makeup-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.makeup-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 12px 14px;
}

.makeup-cat {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text2);
  margin-bottom: 5px;
}

.makeup-val {
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
}

.celeb-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.celeb {
  padding: 5px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text2);
}

.score-detail {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 16px;
  margin-bottom: 22px;
}

.score-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.score-row:last-child { margin-bottom: 0; }

.score-label { font-size: 11px; color: var(--text2); width: 50px; }

.score-track {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.score-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 1s ease;
}

.score-val { font-size: 11px; color: var(--text2); width: 28px; text-align: right; }

/* ── TABS ── */
.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
  gap: 0;
}

.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 10px 20px 10px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
}

.tab-btn:hover { color: var(--text); }

.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* outfit grid */
.outfit-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}

.outfit-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 12px 14px;
}

.outfit-cat {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text2);
  margin-bottom: 5px;
  text-transform: uppercase;
}

.outfit-val {
  font-size: 12px;
  color: var(--text);
  line-height: 1.6;
}

.outfit-note {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.85;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 2px solid var(--accent2);
  padding: 12px 14px;
  margin-top: 4px;
}

/* beauty grid */
.beauty-block {
  margin-bottom: 18px;
}

.beauty-block-title {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--accent2);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.beauty-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.beauty-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 12px 14px;
}

.beauty-cat {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text2);
  margin-bottom: 5px;
}

.beauty-val {
  font-size: 12px;
  color: var(--text);
  line-height: 1.55;
}

.beauty-note {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.85;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 2px solid var(--accent2);
  padding: 12px 14px;
  margin-top: 8px;
}

.disclaimer {
  border-top: 1px solid var(--border);
  margin-top: 8px;
  padding-top: 22px;
  margin-bottom: 24px;
}

.disclaimer-title {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--accent2);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.disclaimer p {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.85;
  margin-bottom: 8px;
}

.disclaimer p:last-child { margin-bottom: 0; }

.disclaimer strong {
  color: var(--text);
  font-weight: 500;
}

.retry-btn {
  display: block;
  width: 100%;
  margin-top: 28px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text2);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.retry-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- INTRO -->
<div class="intro" id="introScreen">
  <div class="intro-bg"></div>
  <div class="season-strip">
    <div class="season-dot" style="background:#f4a261"></div>
    <div class="season-dot" style="background:#f4d58d"></div>
    <div class="season-dot" style="background:#e76f51"></div>
    <div class="season-dot" style="background:#b5c6e0"></div>
    <div class="season-dot" style="background:#9b8dc4"></div>
    <div class="season-dot" style="background:#c9d6ff"></div>
    <div class="season-dot" style="background:#c8703a"></div>
    <div class="season-dot" style="background:#8b6347"></div>
    <div class="season-dot" style="background:#d4a96a"></div>
    <div class="season-dot" style="background:#2d3561"></div>
    <div class="season-dot" style="background:#6c63ff"></div>
    <div class="season-dot" style="background:#a8b4d0"></div>
  </div>

  <h1>Personal<br><em>Color</em> Analysis</h1>
  <p class="intro-sub">퍼스널컬러 정밀 진단 · 12型精细色彩诊断</p>

  <div class="intro-tags">
    <span class="intro-tag">亮春</span><span class="intro-tag">暖春</span><span class="intro-tag">浅春</span>
    <span class="intro-tag">浅夏</span><span class="intro-tag">柔夏</span><span class="intro-tag">冷夏</span>
    <span class="intro-tag">暖秋</span><span class="intro-tag">深秋</span><span class="intro-tag">柔秋</span>
    <span class="intro-tag">深冬</span><span class="intro-tag">冷冬</span><span class="intro-tag">亮冬</span>
  </div>

  <button class="start-btn" onclick="startQuiz()">开始诊断</button>
</div>

<!-- QUIZ -->
<div class="quiz-wrap" id="quizWrap">
  <div class="top-bar">
    <div class="progress-track"><div class="progress-fill" id="pFill"></div></div>
    <div class="q-counter" id="pLabel">0 / 16</div>
  </div>
  <div id="qArea"></div>
</div>

<!-- RESULT -->
<div class="result-wrap" id="resultWrap"></div>

<script>
// ── 评分维度 ──
// warm / cool  → 暖冷
// light / deep → 明暗
// soft / clear → 柔/清

const Q = [
  // 第一组：暖冷判断
  {
    group: "肤色底调",
    q: "在自然光下，你的皮肤底色更接近？",
    hint: "尝试对比一张纯白纸，观察皮肤是否泛黄/泛橙（暖）还是泛粉/泛蓝（冷）",
    type: "text",
    opts: [
      { t: "明显偏黄调、象牙色、奶油色", s: {warm:2} },
      { t: "略带黄调，但不明显", s: {warm:1} },
      { t: "偏中性，较难判断", s: {} },
      { t: "略带粉调或浅玫瑰色", s: {cool:1} },
      { t: "明显偏粉调、泛蓝白感", s: {cool:2} },
    ]
  },
  {
    group: "肤色底调",
    q: "太阳照射或运动后，你的皮肤变红的方式？",
    type: "text",
    opts: [
      { t: "不怎么变红，容易晒成金棕/蜜糖色", s: {warm:2, deep:1} },
      { t: "先变红，慢慢变成暖棕色", s: {warm:1} },
      { t: "先变红，之后变成冷棕色", s: {cool:1} },
      { t: "很容易晒红，不容易晒黑，皮肤偏白且稳定", s: {cool:2, light:1} },
    ]
  },
  {
    group: "肤色底调",
    q: "以下哪种描述最接近你脸上阴影的颜色？",
    hint: "比如颧骨下方、下巴侧面的自然阴影",
    type: "text",
    opts: [
      { t: "暖橙棕、桃木色", s: {warm:2} },
      { t: "暖棕、浅棕", s: {warm:1} },
      { t: "浅灰粉、浅冷棕", s: {cool:1} },
      { t: "偏灰蓝、偏冷紫灰", s: {cool:2} },
    ]
  },

  // 第二组：明暗判断
  {
    group: "对比度",
    q: "你的肤色与发色/眉色之间的对比程度？",
    hint: "对比度高=皮肤很白但头发/眉毛很深；对比度低=皮肤与发色比较接近",
    type: "text",
    opts: [
      { t: "对比非常高，皮肤很白、头发/眉毛很深", s: {deep:2, clear:1} },
      { t: "对比中等偏高", s: {deep:1} },
      { t: "对比中等", s: {} },
      { t: "对比较低，整体偏浅", s: {light:1} },
      { t: "对比很低，皮肤和发色都偏浅", s: {light:2, soft:1} },
    ]
  },
  {
    group: "发色",
    q: "你的天然发色？",
    type: "text",
    opts: [
      { t: "浅棕、亚麻棕（偏暖浅）", s: {warm:1, light:2} },
      { t: "暖棕、红棕、栗子棕", s: {warm:2} },
      { t: "深棕、深暖棕", s: {warm:1, deep:1} },
      { t: "冷棕、灰棕、中性棕", s: {cool:1, soft:1} },
      { t: "深黑、蓝黑（有冷光泽）", s: {cool:2, deep:2} },
      { t: "偏黄或金色调（暖浅）", s: {warm:2, light:2} },
    ]
  },
  {
    group: "眼睛",
    q: "你的眼睛颜色（瞳孔）？",
    type: "text",
    opts: [
      { t: "浅蜂蜜棕、浅榛子色（明亮感强）", s: {warm:1, light:2, clear:1} },
      { t: "暖棕、金棕", s: {warm:2} },
      { t: "深棕、暖深棕", s: {warm:1, deep:1} },
      { t: "冷棕、灰棕、茶棕", s: {cool:1, soft:1} },
      { t: "深黑，眼神清澈锐利", s: {cool:1, deep:2, clear:2} },
      { t: "非常深的黑，沉稳", s: {deep:2} },
    ]
  },

  // 第三组：柔/清判断
  {
    group: "整体印象",
    q: "不化妆时，别人对你气质的描述更接近？",
    type: "text",
    opts: [
      { t: "清透、干净，像去掉杂质的纯净感", s: {clear:2} },
      { t: "通透、亮眼，有自然光泽", s: {clear:1, light:1} },
      { t: "柔和、雾感，略带朦胧感", s: {soft:2} },
      { t: "温柔、自然，不突出也不暗沉", s: {soft:1} },
      { t: "沉稳、成熟，有分量感", s: {deep:1} },
    ]
  },
  {
    group: "色彩感知",
    q: "穿这几种色调，哪种让气色最好看？",
    type: "swatch",
    opts: [

// ── 判断逻辑 ──
function calcType(sc) {
  const isWarm = sc.warm >= sc.cool;
  const isDeep = sc.deep >= sc.light;
  const isClear = sc.clear >= sc.soft;
  const warmGap = Math.abs(sc.warm - sc.cool);
  const depthGap = Math.abs(sc.deep - sc.light);
  const clrGap = Math.abs(sc.clear - sc.soft);

  if (isWarm) {
    if (isDeep) {
      return depthGap > 3 ? 'autumn_deep' : (isClear ? 'autumn_warm' : 'autumn_soft');
    } else {
      return clrGap > 2 ? (isClear ? 'spring_clear' : 'spring_light') : 'spring_warm';
    }
  } else {
    if (isDeep) {
      return depthGap > 3 ? 'winter_deep' : (isClear ? 'winter_cool' : 'winter_bright');
    } else {
      return clrGap > 2 ? (isClear ? 'summer_cool' : 'summer_light') : 'summer_soft';
    }
  }
}

let scores = {warm:0,cool:0,light:0,deep:0,clear:0,soft:0};
let cur = 0;

function startQuiz() {
  document.getElementById('introScreen').classList.add('hidden');
  document.getElementById('quizWrap').style.display = 'flex';
  document.getElementById('quizWrap').style.flexDirection = 'column';
  document.getElementById('quizWrap').style.alignItems = 'center';
  renderQ();
}

function renderQ() {
  const pct = cur / Q.length * 100;
  document.getElementById('pFill').style.width = pct + '%';
  document.getElementById('pLabel').textContent = cur + ' / ' + Q.length;

  if (cur >= Q.length) { showResult(); return; }

  const q = Q[cur];
  let inner = '';

  if (q.type === 'text') {
    inner = '<div class="opts-list">' + q.opts.map((o,i) =>
      `<button class="opt" onclick="pick(${i})"><span class="opt-n">${i+1}</span>${o.t}</button>`
    ).join('') + '</div>';
  } else if (q.type === 'swatch') {
    inner = '<div class="opts-swatch">' + q.opts.map((o,i) =>
      `<button class="sw-btn" onclick="pick(${i})">
        <div class="sw-color" style="background:${o.bg}"></div>
        <div class="sw-label">${o.t.replace('\n','<br>')}</div>
      </button>`
    ).join('') + '</div>';
  } else if (q.type === 'pair') {
    inner = '<div class="opts-pair">' + q.opts.map((o,i) =>
      `<button class="pair-btn" onclick="pick(${i})">
        <div class="pair-color" style="background:${o.bg}"></div>
        <div class="pair-label" style="color:${q.opts[i].tc||'var(--text2)'}">${o.t.replace('\n','<br>')}</div>
      </button>`
    ).join('') + '</div>';
  }

  document.getElementById('qArea').innerHTML = `
    <div class="q-card">
      <div class="q-tag">${q.group} &nbsp;·&nbsp; Q${String(cur+1).padStart(2,'0')}</div>
      <div class="q-text">${q.q}</div>
      ${q.hint ? `<div class="q-hint">💡 ${q.hint}</div>` : ''}
      ${inner}
    </div>
  `;
}

function pick(idx) {
  const s = Q[cur].opts[idx].s;
  for (const k in s) { if (scores[k] !== undefined) scores[k] += s[k]; }

  const area = document.getElementById('qArea');
  area.style.opacity = '0';
  area.style.transform = 'translateX(-12px)';
  area.style.transition = 'all 0.18s ease';

  setTimeout(() => {
    area.style.transition = 'none';
    area.style.opacity = '1';
    area.style.transform = 'none';
    cur++;
    renderQ();
  }, 180);
}

function showResult() {
  document.getElementById('quizWrap').style.display = 'none';
  const rw = document.getElementById('resultWrap');
  rw.style.display = 'flex';
  rw.style.flexDirection = 'column';
  rw.style.alignItems = 'center';

  const key = calcType(scores);
  const r = TYPES[key];
  const o = r.outfit;
  const b = r.beauty;

  const total = Object.values(scores).reduce((a,b)=>a+b,0)||1;
  const pct = k => Math.round(scores[k]/total*100);

  const palHtml = r.palette.map(c =>
    `<div class="r-pal-swatch" style="background:${c}"></div>`
  ).join('');

  const dims = [
    {k:'warm',label:'暖调',color:'#c8703a'},
    {k:'cool',label:'冷调',color:'#6888c0'},
    {k:'light',label:'浅调',color:'#c8b888'},
    {k:'deep',label:'深调',color:'#504030'},
    {k:'clear',label:'清澈',color:'#60a8c0'},
    {k:'soft',label:'柔雾',color:'#9880a0'},
  ];
  const dimHtml = dims.map(d => {
    const v = pct(d.k);
    return `<div class="score-row">
      <div class="score-label">${d.label}</div>
      <div class="score-track"><div class="score-bar-fill" style="width:${v}%;background:${d.color}"></div></div>
      <div class="score-val">${v}%</div>
    </div>`;
  }).join('');

  // TAB 1: 色彩
  const tab1 = `
    <div class="r-section">
      <div class="r-sec-title">色彩维度分析</div>
      <div class="score-detail">${dimHtml}</div>
    </div>
    <div class="r-section">
      <div class="r-sec-title">推荐色彩</div>
      <div class="r-tags">${r.best.map(t=>`<div class="r-tag good">${t}</div>`).join('')}</div>
    </div>
    <div class="r-section">
      <div class="r-sec-title">建议避开</div>
      <div class="r-tags">${r.avoid.map(t=>`<div class="r-tag bad">${t}</div>`).join('')}</div>
    </div>
    <div class="r-section">
      <div class="r-sec-title">同类型参考</div>
      <div class="celeb-list">${r.celebs.map(c=>`<div class="celeb">✦ ${c}</div>`).join('')}</div>
    </div>
  `;

  // TAB 2: 穿搭
  const outfitItems = [
    {k:'style', label:'风格方向'},
    {k:'top',   label:'上装'},
    {k:'bottom',label:'下装'},
    {k:'outer', label:'外套'},
    {k:'acc',   label:'配饰'},
    {k:'avoid', label:'造型误区'},
  ];
  const tab2 = `
    <div class="outfit-grid">
      ${outfitItems.map(i=>`
        <div class="outfit-item" style="${i.k==='style'||i.k==='avoid'?'grid-column:1/-1':''}">
          <div class="outfit-cat">${i.label}</div>
          <div class="outfit-val">${o[i.k]}</div>
        </div>
      `).join('')}
    </div>
    <div class="outfit-note">💡 ${o.tip}</div>
  `;

  // TAB 3: 美妆
  const beautyItems = [
    {k:'base',  label:'底妆'},
    {k:'blush', label:'腮红'},
    {k:'eye',   label:'眼妆'},
    {k:'lip',   label:'唇色'},
  ];
  const tab3 = `
    <div class="beauty-block">
      <div class="beauty-grid">
        ${beautyItems.map(i=>`
          <div class="beauty-item">
            <div class="beauty-cat">${i.label}</div>
            <div class="beauty-val">${b[i.k]}</div>
          </div>
        `).join('')}
      </div>
      <div class="beauty-note">💡 ${b.tip}</div>
    </div>
  `;

  rw.innerHTML = `
    <div class="result-header" style="width:100%">
      <div class="rh-bg" style="background:${r.hdr}"></div>
      <div class="rh-content" style="color:${r.tc}">
        <div class="r-season-label">퍼스널컬러 · PERSONAL COLOR</div>
        <div class="r-type-name">${r.name}</div>
        <div class="r-type-en">${r.en} · ${r.ko}</div>
        <div class="r-palette">${palHtml}</div>
        <div class="r-score-bar">
          <span>暖调 ${scores.warm}pt</span>
          <span>冷调 ${scores.cool}pt</span>
          <span>深调 ${scores.deep}pt</span>
          <span>浅调 ${scores.light}pt</span>
        </div>
      </div>
    </div>
    <div class="result-body" style="width:100%">
      <p class="r-desc">${r.desc}</p>

      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab(0,this)">色彩</button>
        <button class="tab-btn" onclick="switchTab(1,this)">穿搭</button>
        <button class="tab-btn" onclick="switchTab(2,this)">美妆</button>
      </div>

      <div class="tab-panel active" id="tab0">${tab1}</div>
      <div class="tab-panel" id="tab1">${tab2}</div>
      <div class="tab-panel" id="tab2">${tab3}</div>

      <div class="disclaimer">
        <div class="disclaimer-title">关于本测试</div>
        <p>本测试基于 <strong>四季色彩理论（Seasonal Color Analysis）</strong>及视觉感知原理。该理论源自色彩顾问 Carole Jackson 1980 年代的研究，后经日韩美妆行业系统细化为 12 型体系。皮肤、发色、眼睛的暖冷倾向由黑色素比例决定，属客观存在；颜色搭配影响肤色观感，亦有色彩心理学与视觉对比研究支撑。</p>
        <p>然而，12 型细分目前尚无同行评审的学术研究背书，线上问卷也存在主观感知误差。<strong>本结果仅供参考与娱乐，不构成专业建议。</strong>如需精准诊断，建议咨询专业色彩顾问进行线下布料比对（드레이핑）。</p>
      </div>
      <button class="retry-btn" onclick="restart()">重新测试</button>
    </div>
  `;
}

function switchTab(idx, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab' + idx).classList.add('active');
}

function restart() {
  scores = {warm:0,cool:0,light:0,deep:0,clear:0,soft:0};
  cur = 0;
  document.getElementById('resultWrap').style.display = 'none';
  document.getElementById('introScreen').classList.remove('hidden');
}
</script>
</body>
</html>
